name: CI

# No `branches` filter on pull_request: the filter matches a PR's BASE branch,
# so filtering to `main` would skip stacked PRs whose base is another PR branch.
# Leaving it open means every PR in the stack runs CI, which is the whole point.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
